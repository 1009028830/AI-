name: Validate public engineering source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check tomlkit==0.15.1 PyYAML==6.0.2
      - name: Test installer and restore engine
        run: python -B -m unittest discover -s agent-unified/tests -v
      - name: Test engineering template
        run: python -B -m unittest discover -s agent-unified/payload/skills/agents-engineering-skill/tests -v
      - name: Validate engineering template
        run: python agent-unified/payload/skills/agents-engineering-skill/scripts/validate_agents_project.py agent-unified/payload/skills/agents-engineering-skill/assets/agents-project-template --template
